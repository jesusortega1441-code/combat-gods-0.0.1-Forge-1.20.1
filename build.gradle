plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0.16,6.2)'
}

version = '0.1.0'
group = 'com.combatgods'
base { archivesName = 'combatgods' }

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: '1.20.1'

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                combatgods {
                    source sourceSets.main
                }
            }
        }
        client { }
        server { args '--nogui' }
    }
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.3.0'
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
            'Specification-Title'     : 'combatgods',
            'Specification-Vendor'    : 'combatgods',
            'Specification-Version'   : '1',
            'Implementation-Title'    : 'combatgods',
            'Implementation-Version'  : project.version,
            'Implementation-Vendor'   : 'combatgods'
        ])
    }
    // Paso OBLIGATORIO: convierte los nombres de Minecraft a los que usa Forge en el juego.
    // Sin esto el .jar compila pero el mod no carga.
    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
